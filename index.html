<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>2.2 They're Really Funny!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;--y:#B8860B;--yl:#FFF4CC;--k:#111;--w:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--w);color:var(--k);font-family:system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column}
#s{flex:1;overflow:auto;padding:2vh 5vw;max-width:1200px;width:100%;margin:0 auto}
.st{display:inline-block;background:var(--k);color:var(--y);font-weight:700;padding:4px 12px;border-radius:20px;font-size:14px;letter-spacing:.5px}
h2{font-size:clamp(24px,3.6vw,40px);margin:10px 0;border-bottom:4px solid var(--y);padding-bottom:6px}
.ins{font-size:clamp(17px,2vw,22px);margin:8px 0 14px}
.box{border:3px solid var(--y);border-radius:12px;padding:12px 16px;background:var(--yl);margin:8px 0;font-size:clamp(17px,2vw,22px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.card{border:2px solid var(--k);border-radius:12px;padding:10px 14px;font-size:clamp(15px,1.7vw,19px);line-height:1.4}
.card b.n{display:block;color:var(--y);font-size:1.2em}
mark{background:var(--y);color:#fff;padding:0 3px;border-radius:4px}
mark.g{background:var(--k)}
ol.q{font-size:clamp(18px,2.2vw,26px);line-height:1.9;padding-left:1.4em}
.a{display:none;background:var(--k);color:#fff;border-radius:8px;padding:2px 10px;margin-left:8px;font-weight:700}
.a.on{display:inline-block}
.o{display:inline-block;border:2px solid var(--k);border-radius:8px;padding:0 9px;margin:0 3px;cursor:pointer}
.o.sel{background:var(--yl);border-color:var(--y)}.o.ok{background:#1b7f3b;color:#fff;border-color:#1b7f3b}.o.bad{background:#b3261e;color:#fff;border-color:#b3261e}
input{font:inherit;color:#111;border:3px solid var(--y);background:var(--yl);border-radius:8px;padding:0 8px;width:9em}input.ok{background:#d6f3df;border-color:#1b7f3b}input.bad{background:#fbdcda;border-color:#b3261e}
table{border-collapse:collapse;font-size:clamp(16px,2vw,22px);margin:6px 0}td,th{border:2px solid var(--k);padding:6px 14px;text-align:left}th{background:var(--y);color:#fff}
#act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px}
button{font:inherit;font-weight:700;color:#111;border:2px solid var(--k);border-radius:10px;padding:8px 18px;background:#fff;cursor:pointer}.big ol.q{font-size:clamp(26px,3.6vw,44px)}.w{}.cert{border:10px double var(--y);border-radius:12px;padding:3vh 4vw;text-align:center;background:#fffdf5}.c1{font-size:clamp(30px,5vw,60px);font-weight:800;color:var(--y);font-family:Georgia,serif}.c2{font-size:clamp(16px,2vw,24px);margin:8px 0}.c3{font-size:clamp(36px,6vw,72px);font-weight:700;font-family:Georgia,serif;font-style:italic;border-bottom:3px solid var(--k);display:inline-block;padding:0 4vw;margin:6px 0}.c4{font-size:clamp(24px,3.6vw,44px);font-weight:700}.c5{margin-top:14px;font-size:clamp(16px,2vw,22px)}.chat{display:flex;flex-direction:column;gap:12px;margin:10px 0}.bb{max-width:78%;padding:10px 20px;border-radius:24px;font-size:clamp(24px,3vw,38px);line-height:1.3}.bb small{display:block;font-size:.5em;font-weight:700;opacity:.75}.bb.l{align-self:flex-start;background:#fff;border:3px solid var(--k);border-bottom-left-radius:4px}.bb.r{align-self:flex-end;background:var(--y);color:#fff;border:3px solid var(--y);border-bottom-right-radius:4px;text-align:right}.big .card{font-size:clamp(24px,3vw,38px)}.big .ins,.big .box{font-size:clamp(26px,3.6vw,44px)}.w.on{background:var(--y);color:#fff;border-radius:4px;padding:0 3px}.fc{perspective:1200px;height:62vh;cursor:pointer}.fc .in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.f .in{transform:rotateY(180deg)}.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--y);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#fff}.fr{font-size:clamp(90px,16vw,170px)}.bk{transform:rotateY(180deg);background:var(--yl)}
button.p{background:var(--y);color:#fff;border-color:var(--y);box-shadow:0 4px 0 var(--k)}
#ft{position:relative;display:flex;justify-content:center;gap:18px;align-items:center;padding:8px 5vw;border-top:3px solid var(--y)}#tb,#ts{display:none!important}@media(max-width:800px){#tb{position:static}}
#ts{display:none;background:var(--k);color:#fff;padding:10px 5vw;font-size:15px;max-height:26vh;overflow:auto}#ts b{color:var(--y)}
</style></head><body>
<div id="s"></div><div id="act"></div><div id="ts"></div>
<div id="ft"><button id="pv">◀ Previous</button><span id="ct"></span><button id="tb">Teacher script</button><button id="nx" class="p">Next ▶</button></div>
<script>
const L=(a,f)=>'<ol class="q">'+a.map(x=>'<li>'+f(x)+'</li>').join('')+'</ol>';
const R=a=>L(a,x=>{const[q,v]=x.split('||');return q+'<span class="a">'+v+'</span>'});
const C=a=>L(a,x=>x.replace(/\{([^}]+)\}/g,(m,g)=>'<span class="g">'+g.split('|').map(o=>'<span class="o"'+(o[0]=='*'?' data-ok="1"':'')+'>'+o.replace('*','')+'</span>').join(' / ')+'</span>'));
const T=a=>L(a,x=>x.replace(/\{=([^}]+)\}/g,(m,g)=>'<input data-a="'+g+'">'));
const txt={
lara:'<b class="n">Lara</b>Hi! I\'m Lara. I\'m 24. I live with my family in Texas, but we\'re not in Texas now. We\'re with Grandma Vera at her home in Miami. Here\'s a picture of my family.',
par:'<b class="n">Mom and dad</b>Look at my mom and dad. My parents are both 50 – not old, and not young! My mom is short and my dad is tall. They\'re not boring! They\'re really funny.',
eri:'<b class="n">Erika</b>This is Erika. She\'s my sister – and she\'s my best friend! She\'s 19. She\'s a student, and she\'s very smart. She\'s shy, but she\'s friendly, too.',
jus:'<b class="n">Justin</b>This is Justin. He\'s my brother. He\'s funny. He\'s young (12), but he\'s not short – he\'s really tall.',
ver:'<b class="n">Grandma Vera</b>This is my grandmother, Grandma Vera. She\'s old (85!), and she\'s very interesting. She\'s a good grandma!'};
const cards=(f)=>'<div class="cards">'+Object.values(txt).map(t=>'<div class="card">'+f(t)+'</div>').join('')+'</div>';
const hiA=t=>t.replace(/\b(old|young|short|tall|boring|funny|shy|friendly|interesting|smart)\b/g,'<mark>$1</mark>');
const hiG=t=>t.replace(/(we\'re not|They\'re not|he\'s not)/g,'<mark class="g">$1</mark>');
const hiRV=t=>t.replace(/\b(really|very)\b/g,'<mark class="g">$1</mark>');
const S=[
{st:'Welcome',t:'2.2 They\'re really funny!',k:'n',b:'<div class="box"><b>Lesson objective:</b> describe friends and family</div><p class="ins">👨‍👩‍👧‍👦 Today: adjectives (age, appearance, personality) · <i>really / very</i> · <i>is not / are not</i></p>',tp:'Greet. Read the objective aloud. Ask: "What will we do today?" (ICQ).'},
{st:'Lead-in · Context',t:'Four days with my family',k:'n',b:'<p class="ins">A blog post by Lara. Look at the pictures in your book. Who are the people? Where is Lara?</p>'+cards(t=>t.replace(/<b class="n">(.*?)<\/b>.*/,'<b class="n">$1</b>')),tp:'Set context: Lara\'s family post. Elicit what students see (no reading yet). Pre-set the gist task so they read for a purpose.'},
{st:'Reading 1 · Gist',t:'1A Read the messages',k:'r',b:'<p class="ins">Read quickly. Answer.</p>'+R(['Where is Lara from?||Texas','Where is she now?||In Miami, with Grandma Vera','Who are the other people in the pictures?||Her mom and dad, her sister Erika, her brother Justin, Grandma Vera']),tp:'Time limit 1–2 min, silent skim. Peer-check, then click Reveal one at a time. CCQ: "Is Lara in Texas now?"'},
{st:'Reading 2 · Scanning',t:'1B Find the numbers',k:'r',b:'<p class="ins">Read again. Find the numbers. What are they?</p><div class="box"><b>four · 12 · 19 · 24 · 85</b></div>'+R(['four||Four days with my family','12||Justin\'s age','19||Erika\'s age','24||Lara\'s age','85||Grandma Vera\'s age']),tp:'Scan only for numbers. Reveal one by one, then ask: "Who is 50?" (parents).'},
{st:'Vocabulary · Highlighting',t:'Look at the text',k:'n',b:'<p class="ins">Highlighted words describe people.</p>'+cards(hiA),tp:'Highlight with students first: "Which words describe people?" Underline before you show. Elicit the examples.'},
{st:'Vocabulary · 2A',t:'Describing people',k:'r',b:'<table><tr><th>Age</th><th>Appearance</th><th>Personality</th></tr><tr><td>old<br>young</td><td>short<br>tall</td><td>boring · funny · shy<br>friendly · interesting · smart</td></tr></table><p class="ins">Find the adjectives in the messages. Match to the people.</p>'+R(['old||Grandma Vera','young||Justin','short||Lara\'s mom','tall||Lara\'s dad, Justin','boring||Lara\'s parents are NOT boring','funny||Parents, Justin','shy||Erika','friendly||Erika','interesting||Grandma Vera','smart||Erika']),tp:'Reveal one match at a time. Elicit before reveal.'},
{st:'Vocabulary · MPF',t:'Meaning · Pronunciation · Form',k:'r',b:R(['<b>Meaning:</b> Is "short" the opposite of "tall"? Is "boring" the opposite of "funny"?||Yes / No: use the examples in the messages','<b>Pronunciation 1.20:</b> listen and repeat the adjectives||Drill chorally, then individually; mark word stress','<b>Form:</b> He is + adjective · She\'s + adjective||Adjective does not change: tall, not talls'])+'<div class="box">old · young · short · tall · boring · funny · shy · friendly · interesting · smart</div>',tp:'Listen & repeat with the book audio (1.20). Mark stress on 3-syllable <b>interesting</b>. CCQs: "Is Justin old?" "Is Lara\'s dad short?"'},
{st:'Vocabulary · 2B',t:'really / very',k:'r',b:'<p class="ins">Circle <i>really</i> and <i>very</i> in the messages.</p>'+cards(hiRV)+R(['Do they make the adjectives stronger (++) or weaker (–)?||Stronger (++)']),tp:'Students circle in their book. Give: "tall" vs "really tall".'},
{st:'Vocabulary · 2C',t:'Circle the correct word',k:'c',b:C(['A Is he short? B No, he\'s not. He\'s {*tall|shy}.','A Is she boring? B No! She\'s really {short|*interesting}.','A How old is your grandmother? B She\'s 90. She\'s very {young|*old}.','A Is Mi-jin a college student? B Yes. She\'s really {*smart|short}.','A Is your cousin interesting? B Yes, and he\'s {boring|*funny}.','A Are your children shy? B No, they\'re really {*friendly|interesting}.']),tp:'Individual work, pair check, then Check / Show answer. Do vocabulary exercises for 2.2 on page 142 as homework.'},
{st:'Grammar · Noticing',t:'Look at the text again',k:'n',b:'<p class="ins">Highlighted words say "no". Find more.</p>'+cards(hiG),tp:'Use the same text. Elicit: "Is Lara in Texas now?" → "We\'re not in Texas." Board the sentences.'},
{st:'Grammar · Clarification',t:'3A is not / are not',k:'r',b:'<div class="box"><b>He\'s not</b> boring! · <b>She\'s not</b> from Miami · <b>We\'re not</b> in Texas · <b>They\'re not</b> from Miami<br>Erika <b>isn\'t</b> old. · My parents <b>aren\'t</b> from Miami.</div>'+R(['After he, she → ?||\'s not / isn\'t','After you, we, they → ?||\'re not / aren\'t','After a singular noun → ?||isn\'t (Erika isn\'t old)','After a plural noun → ?||aren\'t (My friends aren\'t boring)']),tp:'MPF: Meaning (negative), Pronunciation (/ˈɪznt/, /ɑːnt/ – contraction, stress "not"), Form. Drill: "Erika / old" → "Erika isn\'t old."'},
{st:'Controlled practice · 3A',t:'Circle the correct answers',k:'c',b:C(['1 For negative (–) statements with <i>he</i> and <i>she</i>, use {*\'s not|\'re not}.','2 For negative statements with <i>we</i>, <i>you</i> and <i>they</i>, use {\'s not|*\'re not}.']),tp:'Students use the grammar box and Notice box to decide.'},
{st:'Controlled practice · 3B',t:'Complete the sentences',k:'t',b:'<p class="ins">Use a subject (<i>he, she, you, we, they</i>) and + or – verb.</p>'+T(['1 He\'s not old. He\'s young. <span class="a on" style="background:none;color:gray">(example)</span>','2 She\'s friendly and really funny. {=She\'s not} shy.','3 {=We\'re} from Brazil. We\'re not from Argentina.','4 {=She\'s not} Juliana. She\'s Camila.','5 {=They\'re not} my cousins. They\'re not my brothers.','6 {=You\'re not} American. You\'re Canadian.']),tp:'Item 5: "They\'re" or "They\'re not" accepted only if it matches the book answer key; check the book. Peer check first.'},
{st:'Controlled practice · Page 15',t:'Grammar chart: circle the correct words',k:'c',b:C(['1 Jan {is|*isn\'t} from New York City. He\'s from Miami.','2 {*She\'s|She\'s not} 18. She\'s not 20.','3 Daniel is in Moscow. {He\'s|*He\'s not} in St. Petersburg.','4 You\'re not shy. {*You\'re|You\'re not} really friendly!','5 My cousins are in Japan. {They\'re|*They\'re not} in the U.S.','6 {We\'re|*We\'re not} sisters. We\'re friends.']),tp:'Book: "Now go to page 130. Grammar charts, exercise 2.2." Read the two-line context before choosing.'},
{st:'Freer practice · 3D',t:'Pair work: true or false?',k:'n',b:'<p class="ins">Write <b>two true</b> and <b>two false</b> sentences about a friend or a person in your class. Exchange with a partner. Correct the false sentences.</p><div class="chat"><div class="bb l"><small>Me</small>My friend Carina is not tall. She\'s very funny. She\'s from Japan. She\'s smart.</div><div class="bb r"><small>Partner</small>She is very funny, and she\'s smart. She\'s tall, and she\'s not from Japan.</div><div class="bb l"><small>Me</small><b>Correct!</b></div></div>',tp:'Monitor, note errors with <i>is not / are not</i> and <i>very / really</i> for delayed feedback.'},
{st:'Freer practice · Speaking 4',t:'Talk about your people',k:'n',b:'<p class="ins"><b>A</b> Choose four people (family or friends). Write adjectives to describe them.<br><b>B 👥 Group work</b> Talk about your people. Show pictures on your phone. Ask for more information: age, nationality and city.</p><div class="box">Example: This is my sister. She\'s 19. She\'s very smart, but she\'s not boring!</div>',tp:'Give planning time. Monitor. Delayed error correction on the board; praise good use of <i>very / really</i>.'}
];
let i=0;const $=id=>document.getElementById(id);
function go(n){i=Math.max(0,Math.min(S.length-1,n));const d=S[i];
$('s').innerHTML='<span class="st">'+d.st+'</span><h2>'+d.t+'</h2>'+d.b;
$('ts').innerHTML='<b>Teacher script:</b> '+d.tp;$('ct').textContent=(i+1)+' / '+S.length;
const a=$('act');a.innerHTML=d.k=='r'?'<button class="p" id="rv">Reveal ▼</button><button id="sa">Show all answers</button>':d.k=='c'||d.k=='t'?'<button class="p" id="ck">Check</button><button id="sa">Show the correct answer</button>':'';
document.querySelectorAll('.o').forEach(o=>o.onclick=()=>{o.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel','ok','bad'));o.classList.add('sel')});
if($('rv'))$('rv').onclick=()=>{const x=document.querySelector('.a:not(.on)');if(x)x.classList.add('on')};
if(d.k=='r')$('sa').onclick=()=>document.querySelectorAll('.a').forEach(x=>x.classList.add('on'));
if(d.k=='c'){$('ck').onclick=()=>document.querySelectorAll('.o.sel').forEach(o=>o.classList.add(o.dataset.ok?'ok':'bad'));
$('sa').onclick=()=>document.querySelectorAll('.o').forEach(o=>{o.classList.remove('sel','bad','ok');if(o.dataset.ok)o.classList.add('ok')})}
if(d.k=='t'){const n=s=>s.toLowerCase().replace(/[’]/g,"'").trim();
$('ck').onclick=()=>document.querySelectorAll('input').forEach(x=>{x.classList.remove('ok','bad');if(x.value)x.classList.add(n(x.value)==n(x.dataset.a)?'ok':'bad')});
$('sa').onclick=()=>document.querySelectorAll('input').forEach(x=>{x.value=x.dataset.a;x.classList.remove('bad');x.classList.add('ok')})}}
$('pv').onclick=()=>go(i-1);$('nx').onclick=()=>go(i+1);
$('tb').onclick=()=>{const t=$('ts');t.style.display=t.style.display=='block'?'none':'block'};
onkeydown=e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1)};
const F=[['old','👴👵',`She's old (85!)`,'OLD'],['young','🧒',`He's young (12)`,'YOUNG'],['short','<span style="font-size:.5em">🧍</span>📏',`My mom is short`,'SHORT'],['tall','<span style="font-size:1.15em">🧍</span>📏',`My dad is tall`,'TALL'],['boring','😒',`They're not boring!`,'BOR-ing'],['funny','😂',`He's funny`,'FUN-ny'],['shy','🙈',`She's shy`,'SHY'],['friendly','🤗',`She's friendly, too`,'FRIEND-ly'],['interesting','🧐',`She's very interesting`,'IN-ter-est-ing'],['smart','🧠',`She's very smart`,'SMART']];
const DEF={old:'a person who has lived for many years',young:'not old; born not many years ago',short:'not tall; small in height',tall:'big in height; the opposite of short',boring:'not interesting; you do not want to listen or watch',funny:'makes you laugh',shy:'quiet and not comfortable with new people',friendly:'kind and nice to other people',interesting:'makes you want to learn or hear more',smart:'able to learn and understand things quickly'};
const fcs=F.map((f,n)=>({st:`Vocabulary · Adjective ${n+1}/10`,t:'Flashcard: what is it?',k:'f',w:f[0],b:`<div class="fc"><div class="in"><div class="fr">${f[1]}</div><div class="bk"><b style="font-size:clamp(36px,5.5vw,64px)">${f[0]}</b><div style="font-size:24px;color:#B8860B;font-weight:700">${f[3]}</div><div style="font-size:clamp(18px,2.3vw,28px)"><i>${DEF[f[0]]}</i></div><button class="p" onclick="event.stopPropagation();say('${f[0]}')">🔊 Listen</button><div style="font-size:clamp(18px,2.4vw,28px)">“${f[2]}”</div><div style="font-size:18px">He's / She's + <b>${f[0]}</b></div></div></div></div>`,tp:`<b>Aim:</b> teach “${f[0]}” (MPF). <b>Steps:</b> 1) Show the picture; elicit the word. 2) Click the card: <b>Meaning</b> = the example from Lara's post. 3) <b>Pronunciation:</b> 🔊 listen, repeat chorally ×3, then 2–3 individuals; mark stress (${f[3]}). 4) <b>Form:</b> He's / She's + ${f[0]}. <b>CCQ:</b> “${f[2]}” – ask: “Can you make a sentence about someone in your family?” 🎮 First team to guess the picture +1.`}));
S.splice(S.findIndex(x=>x.st=='Vocabulary · MPF'),1);
S.splice(S.findIndex(x=>x.st=='Vocabulary · 2A'),0,...fcs);
const ci=S.findIndex(x=>x.st=='Lead-in · Context');const cx=S[ci];cx.st='Context';
S.splice(ci,0,{st:'Lead-in',t:'Talk about your family',k:'n',b:`<p class="ins">💬 Talk to your partner. 2 minutes.</p><div class="cards"><div class="card">👨‍👩‍👧‍👦<br>Who is in your family?</div><div class="card">🏠<br>Who do you live with?</div><div class="card">😊<br>Tell me about one person in your family.</div></div><div class="chat" id="exb" style="display:none"><div class="bb l"><small>A</small>Who is in your family?</div><div class="bb r"><small>B</small>My mom, my dad and my sister.</div><div class="bb l"><small>A</small>Is your sister funny?</div><div class="bb r"><small>B</small>Yes, she's really funny!</div></div>`});
const u=S.find(x=>x.st=='Vocabulary · Highlighting');u.st='Vocabulary · Underline';u.t='Underline the words that describe people';u.k='h';u.b=`<p class="ins">Read again. Underline the words that describe people.</p>`+cards(t=>t.replace(/\b(old|young|short|tall|boring|funny|shy|friendly|interesting|smart)\b/g,'<span class="w">$1</span>'));
const m2=S.find(x=>x.st=='Vocabulary · 2A');m2.b=m2.b.replace('Find the adjectives in the messages. Match to the people.','Reread the messages to match the adjectives to the people.');
S.find(x=>x.st=='Controlled practice · 3A').big=1;
const TP={
'Welcome':`<b>Aim:</b> set the objective and the game. <b>Steps:</b> 1) Greet. 2) Read the objective: “describe friends and family”. 3) Make Team A 🟡 and Team B ⚫; teams win points on every slide. <b>ICQ:</b> “What will we do today?” “How do teams get points?”`,
'Lead-in':`<b>Aim:</b> activate ideas and interest before reading. <b>Steps:</b> 1) Pairs talk (2 min). 2) Take 2–3 answers; do not correct yet. 3) Board family words if needed (mom, dad, sister, brother, grandmother). <b>ICQ:</b> “Do we write? (No – speak.)” “How long?” (2 min)`,
'Context':`<b>Aim:</b> set context and a reading purpose. <b>Steps:</b> 1) Point to the title “Four days with my family”. 2) Ask: “Who is Lara? Who are the people in the pictures?” (predict only). 3) Say: “Read quickly. Do not read every word.” <b>ICQ:</b> “Do we read every word?” (No) “How long?” (1–2 min)`,
'Reading 1 · Gist':`<b>Aim:</b> reading for gist (skimming). <b>Steps:</b> 1) Silent skim, 1–2 min. 2) Pairs compare. 3) Reveal one answer per click; elicit first; first correct team +1. <b>CCQ:</b> “Is Lara in Texas now?” (No) <b>Key:</b> Texas · Miami with Grandma Vera · mom, dad, Erika, Justin, Grandma Vera.`,
'Reading 2 · Scanning':`<b>Aim:</b> scanning for specific information. <b>Steps:</b> 1) “Find the numbers only.” 2) Pairs check. 3) Reveal one by one. <b>CCQ:</b> “Who is 50?” (the parents) <b>Key:</b> four = days · 12 Justin · 19 Erika · 24 Lara · 85 Grandma Vera.`,
'Vocabulary · Underline':`<b>Aim:</b> notice target adjectives in context (text-based). <b>Steps:</b> 1) Students reread and underline words that describe people in the book (1–2 min). 2) Pairs compare. 3) Click Reveal: one highlighted word per click; elicit before each. <b>Key:</b> old, young, short, tall, boring, funny, shy, friendly, interesting, smart. 🎮 Team with most correct words +1.`,
'Vocabulary · 2A':`<b>Aim:</b> check meaning from the text. <b>Steps:</b> 1) Reread to match each adjective to the person (2 min). 2) Pairs check. 3) Reveal one by one; first team to answer +1. <b>CCQ:</b> “Are Lara's parents boring?” (No – “They're not boring!”)`,
'Vocabulary · 2B':`<b>Aim:</b> clarify really / very. <b>Steps:</b> 1) Students circle really and very in the messages. 2) Elicit: “tall” vs “really tall”. 3) Reveal the answer. <b>CCQ:</b> “Is ‘very tall’ more tall or less tall?” (More) <b>Key:</b> stronger (++).`,
'Vocabulary · 2C':`<b>Aim:</b> controlled practice. <b>Steps:</b> 1) Individual work, 3 min. 2) Pairs check. 3) Click Check ✔, then Show the correct answer. 🎮 Team score = number correct. Homework: vocabulary exercises, page 142.`,
'Grammar · Noticing':`<b>Aim:</b> notice the target grammar in the same text. <b>Steps:</b> 1) Ask: “Is Lara in Texas now?” → “We're not in Texas.” 2) Students find more negative sentences. 3) Board them. <b>CCQ:</b> “Is it positive or negative?” (Negative)`,
'Grammar · Clarification':`<b>Aim:</b> clarify MPF. <b>Steps:</b> 1) <b>Meaning:</b> negative = no. 2) <b>Pronunciation:</b> contractions ('s not, 're not, isn't, aren't); stress “not”. 3) <b>Form:</b> reveal the rules one per click. 4) Drill: “Erika / old” → “Erika isn't old.” <b>CCQ:</b> “After ‘Erika’ do we use isn't or aren't?” (isn't)`,
'Controlled practice · 3A':`<b>Aim:</b> check understanding of the rule. <b>Steps:</b> 1) Students use the grammar box and Notice box. 2) Pairs check. 3) Check ✔, then Show the correct answer. <b>Key:</b> 1 's not · 2 're not.`,
'Controlled practice · 3B':`<b>Aim:</b> controlled written practice. <b>Steps:</b> 1) Example 1 on the board. 2) Students complete 2–6 (3 min). 3) Pairs check. 4) Check ✔ / Show answer. Check items 3–6 against your book answer key. 🎮 Team score = number correct.`,
'Controlled practice · Page 15':`<b>Aim:</b> more controlled practice (grammar chart). <b>Steps:</b> 1) Read the sentence before the choice. 2) Pairs decide. 3) Check ✔, then Show the correct answer. 🎮 Team that explains why scores +1.`,
'Freer practice · 3D':`<b>Aim:</b> freer written + speaking practice. <b>Steps:</b> 1) Read the example together. 2) Students write 2 true + 2 false sentences (3 min). 3) Swap with a partner; partner says “Correct!” or corrects. 4) Monitor; note errors for delayed feedback. <b>ICQ:</b> “How many true sentences?” (2) “How many false?” (2)`,
'Freer practice · Speaking 4':`<b>Aim:</b> freer speaking. <b>Steps:</b> 1) A: students choose 4 people and write adjectives (3 min). 2) B: groups talk, show phone pictures, ask about age, nationality, city. 3) Monitor; delayed error correction on the board. <b>ICQ:</b> “How many people?” (4) “What can you ask?” (age, nationality, city)`};
S.forEach(d=>{if(TP[d.st])d.tp=TP[d.st]});
const s18=S.find(x=>x.st=='Vocabulary · 2B');s18.k='h';s18.b=`<p class="ins">Circle <i>really</i> and <i>very</i> in the messages.</p>`+cards(t=>t.replace(/\b(really|very)\b/g,'<span class="w">$1</span>'))+R(['Do they make the adjectives stronger (++) or weaker (–)?||Stronger (++)']);
s18.tp=`<b>Aim:</b> clarify really / very. <b>Steps:</b> 1) Students circle <i>really</i> and <i>very</i> in their book (1–2 min). 2) Pairs compare. 3) Click Reveal: the words highlight one per click. 4) Ask: stronger or weaker? Reveal the answer. <b>Elicit:</b> “tall” vs “really tall”. <b>CCQ:</b> “Is ‘very tall’ more tall or less tall?” (More) <b>Key:</b> stronger (++).`;
const s20=S.find(x=>x.st=='Grammar · Noticing');s20.k='h';s20.b=`<p class="ins">Read again. Highlight the sentences that say “no”. Share your answer with a partner.</p>`+cards(t=>t.replace(/(we're not|They're not|he's not)/gi,'<span class="w">$1</span>'));
s20.tp=`<b>Aim:</b> notice the target grammar in the same text. <b>Steps:</b> 1) Ask: “Is Lara in Texas now?” → “We're not in Texas.” 2) Students reread and highlight the negative sentences in their book (2 min). 3) Pairs share answers. 4) Click Reveal: one highlight per click; board each sentence. <b>CCQ:</b> “Is it positive or negative?” (Negative) <b>Key:</b> we're not · They're not · he's not.`;
S.find(x=>x.st=='Freer practice · Speaking 4').big=1;
